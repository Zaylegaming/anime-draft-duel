<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anime Draft Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout : colonne d'arène verticale (format TikTok), deux couleurs de joueur face à face, or pour la victoire */
:root{
  --bg:#0d0a14; --panel:#17121f; --panel2:#211a2c; --line:#342a42;
  --fg:#f3eef8; --mute:#a197b0;
  --p1:#ff3d64; --p1soft:rgba(255,61,100,.16);
  --p2:#2fd0ff; --p2soft:rgba(47,208,255,.16);
  --gold:#ffc63b;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"Chakra Petch","Consolas",monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;
  background-image:radial-gradient(120% 60% at 0% 0%,var(--p1soft),transparent 60%),radial-gradient(120% 60% at 100% 100%,var(--p2soft),transparent 60%);
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1}
.logo{font-size:clamp(48px,14vw,76px);text-transform:uppercase;line-height:.88}
.logo .a{color:var(--p1)} .logo .b{color:var(--p2)}
.logo small{display:block;font-size:.34em;color:var(--mute);letter-spacing:.18em;margin-top:8px}
.lead{color:var(--mute);margin:0;line-height:1.45}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
input{font:inherit;font-size:18px;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px 14px;width:100%;box-sizing:border-box}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;text-transform:uppercase;border:0;border-radius:10px;padding:14px 16px;cursor:pointer;color:#120c18;background:var(--fg);transition:transform .12s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(1px)}
.btn.p1{background:var(--p1);color:#fff} .btn.p2{background:var(--p2)} .btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap} .row>*{flex:1 1 140px}
.note{font-size:14px;color:var(--mute);margin:0}
.warn{font-size:14px;color:var(--gold);margin:0}
.code{font-family:var(--f-num);font-size:44px;letter-spacing:.2em;text-align:center;color:var(--gold)}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{border-radius:12px;padding:12px;background:var(--panel2);border:1px solid var(--line);min-width:0}
.pl.p1{border-color:var(--p1)} .pl.p2{border-color:var(--p2)}
.pl .n{font-family:var(--f-display);font-size:24px;overflow-wrap:anywhere}
.pl.p1 .n{color:var(--p1)} .pl.p2 .n{color:var(--p2)}
/* barre de versus */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs .side{font-family:var(--f-display);font-size:22px;min-width:0;overflow-wrap:anywhere;padding:8px 10px;border-radius:10px;border:2px solid transparent}
.vs .side.p1{color:var(--p1)} .vs .side.p2{color:var(--p2);text-align:right}
.vs .side.on.p1{border-color:var(--p1);background:var(--p1soft)} .vs .side.on.p2{border-color:var(--p2);background:var(--p2soft)}
.vs .mid{font-family:var(--f-num);color:var(--mute);font-size:13px;text-align:center}
/* carte personnage */
.card{position:relative;border-radius:18px;padding:22px 18px;overflow:hidden;background:var(--panel);border:2px solid var(--line);display:flex;gap:16px;align-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.card.p1{border-color:var(--p1);box-shadow:0 0 40px var(--p1soft)} .card.p2{border-color:var(--p2);box-shadow:0 0 40px var(--p2soft)}
.mono{flex:0 0 84px;height:84px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.card .who{min-width:0}
.card .nm{font-family:var(--f-display);font-size:clamp(28px,8vw,40px);line-height:.95;overflow-wrap:anywhere}
.card .sr{color:var(--mute);margin-top:6px;font-weight:600}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:.2}to{transform:none;opacity:1}}
/* slots */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{font:inherit;text-align:left;border-radius:10px;padding:10px 12px;background:var(--panel2);border:1px dashed var(--line);color:var(--fg);display:flex;flex-direction:column;gap:2px;min-width:0;min-height:58px}
.slot .c{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:700}
.slot .v{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.slot.filled{border-style:solid}
.slot.open{cursor:pointer;border-style:solid}
.slot.open.p1{border-color:var(--p1)} .slot.open.p2{border-color:var(--p2)}
.slot.open:hover{background:var(--panel)}
.slot.open .v{color:var(--mute);font-weight:500}
.team{display:flex;flex-direction:column;gap:8px}
.team h3{font-size:20px}
.team.p1 h3{color:var(--p1)} .team.p2 h3{color:var(--p2)}
.mini .slot{min-height:0;padding:7px 10px}
.mini .slot .v{font-size:14px}
.rdy{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.rdy.on{border-color:var(--gold);color:var(--gold)}
.turn{font-family:var(--f-display);font-size:24px;text-align:center;text-transform:uppercase}
.wrap.wide{max-width:1180px}
.arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.arena .center{display:flex;flex-direction:column;gap:12px;min-width:0}
.side-team .slots{grid-template-columns:1fr}
.side-team{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0}
.side-team.act.p1{border-color:var(--p1);box-shadow:0 0 30px var(--p1soft)}
.side-team.act.p2{border-color:var(--p2);box-shadow:0 0 30px var(--p2soft)}
.side-team.p2 h3{text-align:right}
.hint{margin:0;font-size:13px;color:var(--mute)}
.stgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stf{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);min-width:0}
.stf em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--gold);font-weight:500}
.stf input{font-family:var(--f-num);font-size:22px;padding:8px 12px}
.strow{font:inherit;color:var(--fg);text-align:left;cursor:pointer;grid-template-columns:1fr auto}
.strow:hover,.strow.sel{border-color:var(--gold)}
.strow .tot{font-family:var(--f-num);font-size:20px;font-weight:700}
.strow .tot small{font-size:12px;color:var(--mute)}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 6px;vertical-align:middle}
@media (max-width:760px){.arena{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.arena .center{grid-column:1/-1;order:-1}.side-team{padding:8px}.side-team .slot{padding:8px}.side-team .slot .v{font-size:14px}}
.turn.p1{color:var(--p1)} .turn.p2{color:var(--p2)}
/* combat */
.bt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.bt{grid-template-columns:1fr}}
.br{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);opacity:.28;transition:opacity .3s}
.br.show{opacity:1;animation:pop .4s ease-out}
.br .l,.br .r{min-width:0}
.br .r{text-align:right}
.br .ch{font-weight:700;overflow-wrap:anywhere;line-height:1.1}
.br .st{font-family:var(--f-num);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.br .l .st{color:var(--p1)} .br .r .st{color:var(--p2)}
.br .ct{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);font-weight:700;text-align:center;max-width:76px}
.br.w1{border-color:var(--p1);background:linear-gradient(90deg,var(--p1soft),transparent 60%)}
.br.w2{border-color:var(--p2);background:linear-gradient(270deg,var(--p2soft),transparent 60%)}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--p2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--p1)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.score .s{font-family:var(--f-num);font-size:clamp(34px,10vw,52px);font-weight:700;font-variant-numeric:tabular-nums}
.score .s.p1{color:var(--p1)} .score .s.p2{color:var(--p2)}
.win{font-family:var(--f-display);font-size:clamp(36px,11vw,60px);text-align:center;text-transform:uppercase;color:var(--gold);line-height:.95;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.win small{display:block;font-size:.36em;color:var(--fg);letter-spacing:.12em;margin-top:6px}
.banner{background:var(--panel2);border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:10px 12px;font-size:14px}
.rules{margin:0;padding-left:18px;color:var(--mute);line-height:1.5;font-size:15px}
.mode{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);text-align:center}
.art{display:block;width:100%;max-width:100%;height:auto;max-height:min(52vh,420px);object-fit:contain;border-radius:12px;background:var(--panel2)}
.card.has-art{flex-direction:column;align-items:stretch;text-align:center;gap:12px}
.card.has-art .who{display:flex;flex-direction:column;justify-content:center}
.artfig{margin:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px}
.artfig figcaption{font-size:11px;color:var(--mute);text-align:center;overflow-wrap:anywhere;line-height:1.2}
.cr{margin-top:6px;font-size:14px;padding:7px 10px}
.thumb{width:40px;height:52px;border-radius:8px;object-fit:contain;flex:0 0 40px;background:var(--panel2)}
.br .l .ch,.br .r .ch{display:flex;gap:8px;align-items:center}
.br .r .ch{flex-direction:row-reverse}
.gal{display:flex;flex-direction:column;gap:6px}
.gi{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.gi .t{min-width:0}
.gi .t b{display:block;overflow-wrap:anywhere}
.gi .t span{font-size:13px;color:var(--mute)}
.gi img,.gi .ph{width:48px;height:64px;border-radius:8px;object-fit:contain;background:var(--panel2)}
.gi .ph{display:grid;place-items:center;font-family:var(--f-display);color:#fff;font-size:18px}
.gi .acts{display:flex;gap:6px}
.sbtn{font:inherit;font-weight:700;font-size:14px;border-radius:8px;padding:8px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;white-space:nowrap}
.sbtn.add{border-color:var(--gold);color:var(--gold)}
a.sbtn{text-decoration:none;display:inline-block}
.gi .acts{flex-wrap:wrap;justify-content:flex-end}
.sbtn:disabled{opacity:.5;cursor:wait}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>


<div class="wrap" id="app"></div>

<script>
/* Anime Draft Duel — version autonome : remplace les services Claude
   - "room"   : connexion directe entre appareils (PeerJS), l'hôte relaie l'état des joueurs
   - "db"     : documents stockés sur l'appareil (localStorage)
   - "assets" : images stockées sur l'appareil (IndexedDB) */
(function(){
  const PEER_PREFIX="animedraftduel-v1-";
  const PEERJS_URLS=["https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js","https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"];
  let peerLib=null;
  function loadPeerJS(){
    if(peerLib)return peerLib;
    peerLib=new Promise((res,rej)=>{let i=0;const next=()=>{if(window.Peer)return res(window.Peer);if(i>=PEERJS_URLS.length)return rej(new Error("peerjs"));const s=document.createElement("script");s.src=PEERJS_URLS[i++];s.onload=()=>window.Peer?res(window.Peer):next();s.onerror=next;document.head.appendChild(s)};next()});
    return peerLib;
  }

  /* ---------- room ---------- */
  function makeRoom(){
    const myId="local-"+Math.random().toString(36).slice(2);
    let mine={}, remote=new Map(); // peerId -> presence
    let peer=null, peerKey=null, conns=new Map(), hostConn=null, connected=false;
    const peerHandlers=new Set(), connHandlers=new Set();
    let snapshot=[];
    function rebuild(){
      const list=[{peer:myId,by:null,isMe:true,sameTab:true,kind:"viewer",guest:false,presence:Object.freeze({...mine}),updatedAt:Date.now()}];
      for(const [id,p] of remote)list.push({peer:id,by:null,isMe:false,sameTab:false,kind:"viewer",guest:false,presence:Object.freeze({...p}),updatedAt:Date.now()});
      snapshot=Object.freeze(list);
      for(const h of peerHandlers)try{h({peers:snapshot,joined:[],left:[],updated:[]})}catch(e){}
    }
    function setConnected(c){if(c===connected)return;connected=c;for(const h of connHandlers)try{h(c)}catch(e){}}
    function sendAll(msg,except){const d=JSON.stringify(msg);for(const [id,c] of conns)if(id!==except&&c.open)try{c.send(d)}catch(e){}}
    function teardown(){try{peer&&peer.destroy()}catch(e){}peer=null;peerKey=null;conns.clear();hostConn=null;remote.clear();setConnected(false);rebuild()}
    async function ensurePeer(){
      const code=mine.code, role=mine.role;
      const key=code&&role?role+":"+code:null;
      if(key===peerKey)return;
      teardown();
      if(!key)return;
      peerKey=key;
      let Peer;try{Peer=await loadPeerJS()}catch(e){return}
      if(peerKey!==key)return;
      const isHost=role==="host";
      const p=isHost?new Peer(PEER_PREFIX+code):new Peer();
      peer=p;
      p.on("error",err=>{if(peer!==p)return;if(!isHost&&err&&err.type==="peer-unavailable"){setTimeout(()=>{if(peer===p&&!hostConn)connectToHost(p,code)},3000)}});
      p.on("disconnected",()=>{if(peer===p)try{p.reconnect()}catch(e){}});
      if(isHost){
        p.on("open",()=>{if(peer===p)setConnected(true)});
        p.on("connection",c=>{
          c.on("open",()=>{conns.set(c.peer,c);c.send(JSON.stringify({t:"p",from:myId,p:mine}));for(const [id,pr] of remote)c.send(JSON.stringify({t:"p",from:id,p:pr}))});
          c.on("data",d=>{let m;try{m=JSON.parse(d)}catch(e){return}if(m&&m.t==="p"&&m.p&&typeof m.p==="object"){remote.set(c.peer,m.p);rebuild();sendAll({t:"p",from:c.peer,p:m.p},c.peer)}});
          c.on("close",()=>{conns.delete(c.peer);remote.delete(c.peer);rebuild();sendAll({t:"x",from:c.peer})});
        });
      }else{
        p.on("open",()=>{if(peer===p)connectToHost(p,code)});
      }
    }
    function connectToHost(p,code){
      const c=p.connect(PEER_PREFIX+code,{reliable:true});
      c.on("open",()=>{if(peer!==p)return;hostConn=c;conns.set("host",c);setConnected(true);c.send(JSON.stringify({t:"p",from:myId,p:mine}))});
      c.on("data",d=>{let m;try{m=JSON.parse(d)}catch(e){return}if(!m)return;if(m.t==="p"&&m.p&&typeof m.p==="object"){remote.set(m.from,m.p);rebuild()}else if(m.t==="x"){remote.delete(m.from);rebuild()}});
      c.on("close",()=>{if(peer!==p)return;hostConn=null;conns.delete("host");remote.clear();setConnected(false);rebuild();setTimeout(()=>{if(peer===p&&!hostConn)connectToHost(p,code)},2000)});
    }
    rebuild();
    return Object.freeze({
      async presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}rebuild();await ensurePeer();sendAll({t:"p",from:myId,p:mine})},
      peers(){return snapshot},
      onPeers(h){peerHandlers.add(h);setTimeout(()=>h({peers:snapshot,joined:snapshot,left:[],updated:[]}),0);return()=>peerHandlers.delete(h)},
      onConnection(h){connHandlers.add(h);setTimeout(()=>h(connected),0);return()=>connHandlers.delete(h)},
      connected(){return connected},
      async emit(){}, on(){return()=>{}}
    });
  }

  /* ---------- db (local) ---------- */
  function makeDb(){
    const KEY="add-db:";
    const subs=new Map();
    const read=p=>{try{const v=localStorage.getItem(KEY+p);return v?JSON.parse(v):undefined}catch(e){return undefined}};
    const snap=p=>{const d=read(p);return{id:p.split("/").pop(),exists:d!==undefined,data:()=>d}};
    return Object.freeze({doc(path){return{
      id:path.split("/").pop(),path,
      async get(){return snap(path)},
      async set(data){try{localStorage.setItem(KEY+path,JSON.stringify(data))}catch(e){throw{code:"resource_exhausted"}}for(const h of subs.get(path)||[])try{h(snap(path))}catch(e){}},
      onSnapshot(next){if(!subs.has(path))subs.set(path,new Set());subs.get(path).add(next);setTimeout(()=>next(snap(path)),0);return()=>subs.get(path).delete(next)}
    }}});
  }

  /* ---------- assets (IndexedDB) ---------- */
  const urls=new Map();
  window.__blobUrl=id=>urls.get(id)||"";
  function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("anime-draft-duel",1);r.onupgradeneeded=()=>r.result.createObjectStore("art");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  async function tx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("art",mode),s=t.objectStore("art");const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})}
  async function makeAssets(){
    try{const keys=await tx("readonly",s=>s.getAllKeys());const blobs=await tx("readonly",s=>s.getAll());(keys||[]).forEach((k,i)=>{if(blobs[i])urls.set(k,URL.createObjectURL(blobs[i]))})}catch(e){}
    const hex=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");
    return Object.freeze({
      async upload(blob){if(blob.size>20*1024*1024)throw{code:"too_large"};const id=hex();await tx("readwrite",s=>s.put(blob,id));const url=URL.createObjectURL(blob);urls.set(id,url);return{id,url,sizeBytes:blob.size,contentType:blob.type}},
      async delete(id){await tx("readwrite",s=>s.delete(id));const u=urls.get(id);if(u)URL.revokeObjectURL(u);urls.delete(id);return{deleted:true}},
      async list(){return{assets:[...urls.keys()].map(id=>({id})),usage:{}}}
    });
  }


  /* ---------- sauvegarde des images : un seul fichier .addpack ---------- */
  const MAGIC="ADDPACK1";
  function b64(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
  async function androidSave(file,name){
    if(!window.AndroidSave.begin(name))throw new Error("Impossible de préparer le fichier.");
    const step=393216;
    for(let o=0;o<file.size;o+=step){const part=new Uint8Array(await file.slice(o,o+step).arrayBuffer());window.AndroidSave.append(b64(part))}
    window.AndroidSave.finish();
  }
  window.__pack={
    async save(artMap,creditMap){
      const items=[],parts=[];
      for(const [slug,id] of Object.entries(artMap||{})){
        let blob=null;try{blob=await tx("readonly",s=>s.get(id))}catch(e){}
        if(!blob)continue;
        items.push({slug,type:blob.type||"image/png",size:blob.size});parts.push(blob);
      }
      const enc=new TextEncoder();
      const header=enc.encode(JSON.stringify({format:"anime-draft-duel-images",version:1,credits:creditMap||{},items}));

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function deck(seed){const r=rng(seed),d=C.map((_,i)=>i);for(let i=d.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[d[i],d[j]]=[d[j],d[i]]}return d}

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}

async function saveStats(i,reset){
  if(!statDoc)return;
  const k=slug(C[i][0]),orig=C[i].slice(2,10);
  let vals=orig;
  if(!reset){vals=CATS.map((_,j)=>{const el=document.getElementById(`st-${i}-${j}`);const n=Math.round(Number(el&&el.value));return Number.isFinite(n)?Math.max(0,Math.min(1000,n)):orig[j]})}

function matchFile(n){
  const raw=slug(n.replace(/\.[^.]+$/,""));
  // on essaie le nom tel quel, puis sans suffixe (« _2 », « _art »…)
  for(const s of [raw,raw.replace(/_(art|artwork|fanart|\d+)$/,"")]){
    if(s in idxFull)return idxFull[s];
    // anciens noms des persos (avant renommage)
    if(OLD_NAMES[s]&&slug(OLD_NAMES[s]) in idxFull)return idxFull[slug(OLD_NAMES[s])];
    const b=idxBase[s];if(b&&b.length===1)return b[0];
  }
  return -1;
}
async function bulkImport(files){
  if(!assets||!artDoc||(importState&&!importState.finished))return;
  const all=[...files],list=all.filter(f=>/^image\//.test(f.type));
  importState={done:0,total:list.length,ok:0,miss:[],err:0,skipped:all.length-list.length,finished:false};galMsg="";render();
  let m={...artMap},pending=0;const old=[];
  for(const f of list){
    const i=matchFile(f.name);
    if(i<0)importState.miss.push(f.name);
    else{try{
      const r=await assets.upload(f),k=slug(C[i][0]);
      if(m[k]&&m[k]!==r.id)old.push(m[k]);
      m={...m,[k]:r.id};importState.ok++;pending++;
      if(pending>=10){artMap=m;await artDoc.set(m);pending=0}
    }catch(e){importState.err++}}
    importState.done++;render();
  }
  if(pending){artMap=m;try{await artDoc.set(m)}catch(e){importState.err+=pending}}
  for(const id of old)assets.delete(id).catch(()=>{});
  importState.finished=true;render();
}

function game(){
  if(mode==="local")return local;
  const host=me.role==="host"?{nick,epoch:me.epoch,seed:me.seed,started:me.started,picks:me.picks,skips:me.skips,ready:me.ready?me.epoch:-1}:others.host;
  let guest=me.role==="guest"?{nick,epoch:me.epoch,picks:me.picks,skips:me.skips,ready:me.ready?me.epoch:-1}:others.guest;
  if(!host)return{host:null,guest};
  if(guest&&guest.epoch!==host.epoch)guest={...guest,picks:empty(),skips:0};
  return{seed:host.seed,epoch:host.epoch,started:host.started,host,guest};
}
function turnOf(g){const a=filled(g.host.picks),b=filled(g.guest.picks);if(a===8&&b===8)return"done";return a===b?"host":"guest"}
function charFor(g,role){const p=g[role],n=filled(p.picks)+p.skips;return deck(g.seed)[2*n+(role==="guest"?1:0)]}

/* ---------- réseau (présence) ---------- */
function pushPresence(){
  if(!room)return;
  const p={app:"add1",code:me.code,role:me.role,nick:nick.slice(0,24),epoch:me.epoch,picks:me.picks,skips:me.skips};
  p.ready=me.ready?me.epoch:-1;
  if(me.role==="host"){p.seed=me.seed;p.started=me.started}
  room.presence(p).catch(()=>{});
}
function readPeers(){
  if(!room)return;
  const o={host:null,guest:null,specs:0};
  for(const pe of room.peers()){
    if(pe.isMe&&pe.sameTab)continue;
    const p=pe.presence||{};
    if(p.app!=="add1"||!me.code||p.code!==me.code)continue;
    const pick=Array.isArray(p.picks)&&p.picks.length===8?p.picks.map(x=>Number.isInteger(x)&&x>=-1&&x<C.length?x:-1):empty();
    const v={nick:String(p.nick||"Joueur").slice(0,24),epoch:p.epoch|0,seed:p.seed>>>0,started:!!p.started,picks:pick,skips:Math.min(1,p.skips|0),ready:Number.isInteger(p.ready)?p.ready:-1};
    if(p.role==="host"&&!o.host)o.host=v;else if(p.role==="guest"&&!o.guest)o.guest=v;else o.specs++;
  }
  others=o;
  // l'invité suit la manche lancée par l'hôte
  if(me.role==="guest"&&o.host&&o.host.epoch!==me.epoch){me.epoch=o.host.epoch;me.picks=empty();me.skips=0;me.ready=false;pushPresence()}
  if(maybeAutoStart())return;
  render();
}
// La partie (ou la revanche) se lance seule quand les deux joueurs sont prêts
function maybeAutoStart(){
  if(mode!=="online"||me.role!=="host"||!me.ready||!others.guest||others.guest.ready!==me.epoch)return false;
  const g=game();
  if(me.started&&!(g.guest&&turnOf(g)==="done"))return false;
  startOnline();return true;
}
function toggleReady(){if(mode!=="online"||(me.role!=="host"&&me.role!=="guest"))return;me.ready=!me.ready;pushPresence();if(!maybeAutoStart())render()}
function readyRow(g){

  const tag=r=>g[r]?`<span class="rdy ${isR(r)?"on":""}">${isR(r)?"Prêt":"Pas prêt"}</span>`:"";
  return `<div class="players"><div class="pl p1"><div class="label">Hôte</div><div class="n">${g.host?esc(g.host.nick):"En attente…"}</div>${tag("host")}</div>
  <div class="pl p2"><div class="label">Adversaire</div><div class="n">${g.guest?esc(g.guest.nick):"En attente…"}</div>${tag("guest")}</div></div>`;
}
function readyBtn(g,label){
  if(me.role!=="host"&&me.role!=="guest")return `<p class="note" style="text-align:center">Tu regardes en spectateur.</p>`;
  if(!g.guest||!g.host)return `<p class="note" style="text-align:center">${me.role==="host"?"Partage le code à ton adversaire.":"Recherche de la partie…"}</p>`;
  const other=me.role==="host"?g.guest:g.host,otherR=other.ready===g.epoch;
  return `<button class="btn ${me.ready?"ghost":"gold"}" id="ready">${me.ready?"Annuler, je ne suis plus prêt":label}</button>
  <p class="note" style="text-align:center">${me.ready?(otherR?"Lancement…":"En attente de "+esc(other.nick)+"…"):(otherR?esc(other.nick)+" est prêt, à toi !":"La partie se lance quand les deux joueurs sont prêts.")}</p>`;
}
async function connect(){
  try{
    room=await window.claude?.use?.("room");
    if(!room){roomErr=true;render();return}
    room.onPeers(readPeers,()=>{roomErr=true;render()});
    room.onConnection(c=>{roomReady=c;render()},()=>{roomErr=true;render()});
  }catch(e){roomErr=true;render()}
}

function setNick(){const v=document.getElementById("nick").value.trim();if(!v){document.getElementById("nickerr").hidden=false;return false}nick=v.slice(0,24);store("add-nick",nick);return true}
function newCode(){const a="abcdefghjkmnpqrstuvwxyz23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function createOnline(){if(!setNick())return;mode="online";screen="lobby";me={role:"host",code:newCode(),epoch:1,seed:0,started:false,picks:empty(),skips:0};pushPresence();readPeers()}
function joinOnline(){
  if(!setNick())return;
  const c=document.getElementById("joincode").value.trim().toLowerCase();
  if(!/^[a-z0-9]{4}$/.test(c)){document.getElementById("codeerr").hidden=false;return}
  mode="online";screen="lobby";me={role:"guest",code:c,epoch:0,seed:0,started:false,picks:empty(),skips:0};
  readPeers();if(others.guest)me.role="spec";pushPresence();render();
}
function startOnline(){me.seed=(Math.random()*4294967296)>>>0;me.epoch++;me.started=true;me.picks=empty();me.skips=0;me.ready=false;pushPresence();render()}
function startLocal(){
  const a=document.getElementById("n1").value.trim()||"Joueur 1",b=document.getElementById("n2").value.trim()||"Joueur 2";
  mode="local";local={seed:(Math.random()*4294967296)>>>0,epoch:Date.now(),started:true,host:{nick:a.slice(0,24),picks:empty(),skips:0},guest:{nick:b.slice(0,24),picks:empty(),skips:0}};render();
}
function place(cat){
  const g=game(),t=turnOf(g);
  if(mode==="local"){const p=local[t];if(p.picks[cat]>=0)return;p.picks[cat]=charFor(g,t);render();return}
  if(t!==me.role||me.picks[cat]>=0)return;
  me.picks=me.picks.slice();me.picks[cat]=charFor(g,t);pushPresence();render();
}
function skip(){
  const g=game(),t=turnOf(g);
  if(mode==="local"){if(local[t].skips<1){local[t].skips=1;render()}return}
  if(t===me.role&&me.skips<1){me.skips=1;pushPresence();render()}
}
function rematch(){if(mode==="local"){local.seed=(Math.random()*4294967296)>>>0;local.epoch=Date.now();for(const r of["host","guest"]){local[r].picks=empty();local[r].skips=0}render()}else if(me.role==="host")startOnline()}
function leave(){mode=null;screen="home";me={role:null,code:null,epoch:0,seed:0,started:false,picks:empty(),skips:0,ready:false};local=null;pushPresence();render()}

/* ---------- rendu ---------- */

  <div class="card ${side}${a?" has-art":""}">${a?`<figure class="artfig"><img class="art" src="${a}" alt="${esc(c[0])}">${creditOf(i)?`<figcaption>Art : ${esc(creditOf(i))}</figcaption>`:""}</figure>`:`<div class="mono" style="background:linear-gradient(135deg,hsl(${h} 70% 48%),hsl(${(h+50)%360} 70% 30%))">${esc(initials(c[0]))}</div>`}
  <div class="who"><div class="nm">${esc(c[0])}</div><div class="sr">${esc(c[1])}</div></div></div>`;

function slots(p,side,active,mini){
  return `<div class="slots${mini?" mini":""}">${CATS.map((cat,k)=>{
    const v=p.picks[k];

    if(active)return `<button class="slot open ${side}" data-place="${k}" id="slot-${k}"><span class="c">${cat}</span><span class="v">Placer ici</span></button>`;
    return `<div class="slot"><span class="c">${cat}</span><span class="v" style="color:var(--mute)">—</span></div>`;

}
function vsBar(g,t){

/* ---------- sauvegarde des images (appli PC / Android uniquement) ---------- */
let packMsg="", packBusy=false;
async function exportPack(){
  if(!window.__pack||!assets||packBusy)return;
  const n=C.filter((_,i)=>artOf(i)).length;
  if(!n){packMsg="Aucune image à sauvegarder pour l'instant.";return render()}
  packBusy=true;packMsg="Préparation de la sauvegarde ("+n+" images)…";render();
  try{const r=await window.__pack.save(artMap,creditMap);packMsg=r.count+" image(s) sauvegardée(s) dans « "+r.name+" »."+(r.note?" "+r.note:"")}
  catch(e){packMsg="La sauvegarde a échoué. "+(e&&e.message?e.message:"Réessaie.")}
  packBusy=false;render();
}
async function importPack(file){
  if(!window.__pack||!assets||!artDoc||packBusy||!file)return;
  packBusy=true;packMsg="Lecture du fichier…";render();
  try{
    const pack=await window.__pack.read(file);
    const known=new Set(C.map(c=>slug(c[0])));
    let m={...artMap},ok=0,skip=0,done=0;const old=[];
    for(const e of pack.items){
      done++;
      if(!known.has(e.slug)){skip++;continue}
      const r=await assets.upload(e.blob);
      if(m[e.slug]&&m[e.slug]!==r.id)old.push(m[e.slug]);
      m={...m,[e.slug]:r.id};ok++;
      if(done%10===0){packMsg="Import… "+done+" / "+pack.items.length;render()}
    }
    artMap=m;await artDoc.set(m);
    for(const id of old)assets.delete(id).catch(()=>{});
    const cr={...creditMap};for(const k in pack.credits||{})if(known.has(k)&&typeof pack.credits[k]==="string")cr[k]=pack.credits[k].slice(0,60);
    if(creditDoc){creditMap=cr;await creditDoc.set(cr)}
    packMsg=ok+" image(s) importée(s)"+(skip?" · "+skip+" ignorée(s) (perso absent du jeu)":"")+".";
  }catch(e){packMsg="Ce fichier n'est pas une sauvegarde d'images Anime Draft Duel valide."}
  packBusy=false;render();
}
function viewPack(){
  return `<div class="panel"><div class="label">Sauvegarde des images</div>
  <p class="note">Exporte toutes tes images (et leurs crédits) dans un seul fichier, puis importe-le sur un autre appareil, par exemple du PC vers le téléphone. Les images importées remplacent celles des mêmes persos.</p>
  ${packMsg?`<div class="banner">${esc(packMsg)}</div>`:""}
  <div class="row"><button class="btn gold" id="packexport" ${packBusy?"disabled":""}>Exporter mes images</button><label class="btn ghost" for="packimport" style="text-align:center">Importer une sauvegarde</label></div>
  <input type="file" id="packimport" accept=".addpack,application/octet-stream" hidden></div>`;
}
function viewGallery(){
  const q=(document.getElementById("gsearch")?.value||"").trim().toLowerCase();
  const list=C.map((c,i)=>i).filter(i=>(!q||(C[i][0]+" "+C[i][1]).toLowerCase().includes(q))&&(!onlyMissing||!artOf(i)));
  const n=C.filter((_,i)=>artOf(i)).length;
  return `<div class="mode">Artworks</div><h2 style="font-size:34px">Images des personnages</h2>
  <p class="lead">Ajoute une image par personnage. Elle s'affiche sur la carte pendant la draft et au combat, pour toi et ton adversaire. Format portrait conseillé.</p>
  <div class="panel"><div class="label">${n} / ${C.length} personnages illustrés</div>
  <input id="gsearch" placeholder="Rechercher un perso ou une série" autocomplete="off">
  <button class="sbtn ${onlyMissing?"add":""}" id="missing" aria-pressed="${onlyMissing}">${onlyMissing?"Afficher tous les persos":"Seulement les persos sans image ("+(C.length-n)+")"}</button></div>
  <div class="panel"><div class="label">Import en masse</div>
  <p class="note">Nomme chaque image comme le perso dans le jeu, par exemple « Gojo.png » ou « Naruto (Baryon).jpg ». Majuscules et accents ne comptent pas. Pour un perso à forme unique, le nom sans la parenthèse marche aussi (« Kaido.png »). Une image déjà présente est remplacée.</p>
  <div class="row"><label class="btn gold" for="bulk" style="text-align:center">Importer des images</label><label class="btn ghost" for="bulkdir" style="text-align:center">Importer un dossier</label></div>
  <input type="file" id="bulk" accept="image/*" multiple hidden><input type="file" id="bulkdir" webkitdirectory multiple hidden></div>
  ${viewImport()}
  ${window.__pack?viewPack():""}
  ${viewChain()}
  ${galMsg?`<div class="banner">${esc(galMsg)}</div>`:""}
  <div class="gal">${list.map(i=>{const c=C[i],a=artOf(i),k=slug(c[0]),h=hue(c[1]);
    return `<div class="gi">${a?`<img src="${a}" alt="">`:`<div class="ph" style="background:hsl(${h} 55% 35%)">${esc(initials(c[0]))}</div>`}
    <div class="t"><b>${esc(c[0])}</b><span>${esc(c[1])}</span>${a?`<input class="cr" id="cr-${i}" data-cr="${i}" maxlength="60" placeholder="Crédit artiste (ex. @pseudo)" value="${esc(creditOf(i))}">`:""}</div>
    <div class="acts">${a?"":`<a class="sbtn srch" data-name="${esc(c[0])}" href="${searchUrl(c)}" target="_blank" rel="noopener">Chercher</a>`}<label class="sbtn ${a?"":"add"}" for="f-${i}">${busy[k]?"Envoi…":a?"Changer":"Ajouter"}</label>
    <input type="file" accept="image/*" id="f-${i}" data-art="${i}" hidden>
    ${a?`<button class="sbtn" data-rm="${i}" ${busy[k]?"disabled":""}>Retirer</button>`:""}</div></div>`}).join("")}
  ${list.length?"":`<p class="note">Aucun personnage ne correspond.</p>`}</div>
  <button class="btn ghost" id="home">Retour</button>`;
}
function viewLobby(){
  const g=game(),hostP=g.host,guestP=g.guest;
  const isHost=me.role==="host";
  return `<div class="mode">Salle en ligne</div>
  <div class="panel" style="align-items:center"><div class="label">Code de la partie</div><div class="code">${esc(me.code)}</div>
  <button class="btn ghost" id="copy" style="font-size:16px">Copier le code</button></div>
  ${!roomReady?`<div class="banner">Connexion à la salle…</div>`:""}
  ${readyRow({...g,epoch:hostP?hostP.epoch:me.epoch})}
  ${me.role==="spec"?`<p class="note">La partie est déjà complète : tu regardes en spectateur.</p>`:""}
  ${readyBtn({...g,epoch:hostP?hostP.epoch:me.epoch},"Je suis prêt")}
  ${others.specs?`<p class="note">${others.specs} spectateur(s)</p>`:""}
  <button class="btn ghost" id="leave">Quitter</button>`;
}
function viewDraft(g,t){
  const side=SIDE[t];
  const mine=mode==="local"?t:me.role;
  const canAct=mode==="local"||t===me.role;
  let html=`<div class="mode">${mode==="local"?"Partie locale":"En ligne · "+esc(me.code)}</div>${vsBar(g,t)}`;
  if(mode==="online"&&(!g.guest||!g.host))html+=`<div class="banner">Ton adversaire s'est déconnecté. En attente de son retour…</div>`;
  const team=r=>{const act=canAct&&r===t;return `<div class="team side-team ${SIDE[r]}${act?" act":""}"><h3>${esc(g[r].nick)}</h3>${act?`<p class="hint">Choisis une case</p>`:""}${slots(g[r],SIDE[r],act,!act)}</div>`};
  let mid=`<div class="turn ${side}">${canAct?(mode==="local"?"Au tour de "+esc(g[t].nick):"À toi de jouer"):"Tour de "+esc(g[t].nick)}</div>`;
  mid+=charCard(charFor(g,t),side,canAct?"Ton personnage":"Personnage de "+g[t].nick);
  if(canAct)mid+=`<button class="btn ghost" id="skip" ${g[t].skips>=1?"disabled":""}>${g[t].skips>=1?"Relance utilisée":"Relancer (1 restante)"}</button>`;
  html+=`<div class="arena">${team("host")}<div class="center">${mid}</div>${team("guest")}</div>`;
  html+=`<button class="btn ghost" id="leave">Quitter</button>`;
  return html;
}
function viewBattle(g){
  const key=mode+":"+g.epoch+":"+g.seed;
  if(revealKey!==key){revealKey=key;revealN=0;clearInterval(revealTimer);revealTimer=setInterval(()=>{revealN++;render();if(revealN>8)clearInterval(revealTimer)},matchMedia("(prefers-reduced-motion:reduce)").matches?60:1100)}
  let s1=0,s2=0,w1=0,w2=0;
  const rows=CATS.map((cat,k)=>{
    const a=g.host.picks[k],b=g.guest.picks[k],va=stat(a,k),vb=stat(b,k),show=k<revealN;
    if(show){s1+=va;s2+=vb;if(va>vb)w1++;else if(vb>va)w2++}
    const cls=show?(va>vb?"w1":vb>va?"w2":""):"";
    const ta=artOf(a),tb=artOf(b);
    return `<div class="br ${show?"show":""} ${cls}"><div class="l"><div class="ch">${ta?`<img class="thumb" src="${ta}" alt="">`:""}<span>${esc(C[a][0])}</span></div><div class="st">${show?va:"??"}</div></div>
    <div class="ct">${cat}</div><div class="r"><div class="ch">${tb?`<img class="thumb" src="${tb}" alt="">`:""}<span>${esc(C[b][0])}</span></div><div class="st">${show?vb:"??"}</div></div>
    ${show?`<div class="bar"><i style="width:${(va/(va+vb)*100).toFixed(1)}%"></i></div>`:""}</div>`;
  }).join("");
  const done=revealN>8;
  let res="";
  if(done){res=s1===s2?`<div class="win">Égalité !<small>${s1} partout</small></div>`:`<div class="win" style="color:${s1>s2?"var(--p1)":"var(--p2)"}">${esc(s1>s2?g.host.nick:g.guest.nick)}<small>remporte le duel</small></div>`}
  const canRe=mode==="local"||me.role==="host";
  return `<div class="mode">Combat final</div>
  <div class="score"><div><div class="label">${esc(g.host.nick)}</div><div class="s p1">${s1}</div></div><div class="label">VS</div><div><div class="label">${esc(g.guest.nick)}</div><div class="s p2">${s2}</div></div></div>
  ${res}<div class="bt">${rows}</div>
  ${done?`<p class="note" style="text-align:center">Manches gagnées : ${w1} – ${w2} · total sur 8000</p>`:""}
  ${done?(mode==="local"?`<button class="btn gold" id="rematch">Revanche</button>`:`<div class="label" style="text-align:center">Revanche</div>${readyRow(g)}${readyBtn(g,"Prêt pour la revanche")}`):`<button class="btn ghost" id="fast">Tout révéler</button>`}
  <button class="btn ghost" id="leave">Quitter</button>`;
}
function render(){
  const app=document.getElementById("app");
  const focus=document.activeElement&&document.activeElement.id;
  const vals={};for(const el of document.querySelectorAll("input[id]")){if(el.type!=="file")vals[el.id]=el.value}
  let html;
  if(!mode)html=screen==="gallery"&&assets&&artDoc?viewGallery():viewHome();
  else{const g=game();
    if(mode==="online"&&(!g.host||!g.started||!g.guest&&!g.started))html=viewLobby();
    else if(mode==="online"&&!g.guest)html=viewDraft({...g,guest:{nick:"…",picks:empty(),skips:0}},turnOf({...g,guest:{picks:empty()}}));
    else{const t=turnOf(g);html=t==="done"?viewBattle(g):viewDraft(g,t)}}
  app.innerHTML=html;
  app.classList.toggle("wide",html.includes('class="arena"')||html.includes('class="bt"'));
  for(const id in vals){const el=document.getElementById(id);if(el)el.value=vals[id]}
  if(focus){const el=document.getElementById(focus);if(el){el.focus();if(el.tagName==="INPUT"&&el.type!=="file"){try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}}
}
document.addEventListener("change",e=>{if(e.target.id==="packimport"&&e.target.files&&e.target.files[0]){const f=e.target.files[0];e.target.value="";return importPack(f)}if((e.target.id==="bulk"||e.target.id==="bulkdir")&&e.target.files&&e.target.files.length)return bulkImport(e.target.files);const c=e.target.dataset&&e.target.dataset.cr;if(c!==undefined)return saveCredit(+c,e.target.value);const i=e.target.dataset&&e.target.dataset.art;if(i!==undefined&&e.target.files&&e.target.files[0])uploadArt(+i,e.target.files[0])});
document.addEventListener("input",e=>{if(e.target.id==="gsearch"||e.target.id==="ssearch")render()});
document.addEventListener("change",e=>{if(e.target.id==="sedited")render()});
document.addEventListener("click",e=>{
  const sl=e.target.closest("a#nextsearch, a.srch");
  if(sl){
    const name=sl.dataset.name;
    try{const p=navigator.clipboard&&navigator.clipboard.writeText(name);galMsg="Nom copié : "+name+" (colle-le en enregistrant l'image).";if(p)p.catch(()=>{galMsg="Copie automatique bloquée par le navigateur. Nom du perso : "+name;render()})}catch(err){galMsg="Copie automatique bloquée par le navigateur. Nom du perso : "+name}
    const k=sl.id==="nextsearch"?sl.dataset.k:null;
    setTimeout(()=>{if(k)searched.add(k);render()},0);return;
  }
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.st!==undefined){statSel=+b.dataset.st;statMsg="";render();window.scrollTo(0,0);return}
  if(b.id==="savestats")return saveStats(+b.dataset.i,false);
  if(b.id==="resetstats")return saveStats(+b.dataset.i,true);
  if(b.id==="closestats"){statSel=null;return render()}
  if(b.id==="statsed"){screen="stats";statSel=null;statMsg="";render();window.scrollTo(0,0);return}
  if(b.id==="skipsearch"){searched.add(b.dataset.k);return render()}
  if(b.id==="resetsearch"){searched=new Set();return render()}
  if(b.dataset.place!==undefined)return place(+b.dataset.place);
  if(b.dataset.rm!==undefined)return removeArt(+b.dataset.rm);
  const a={gallery:()=>{screen="gallery";galMsg="";render();window.scrollTo(0,0)},home:()=>{screen="home";render()},missing:()=>{onlyMissing=!onlyMissing;render()},closeimport:()=>{importState=null;render()},packexport:exportPack,create:createOnline,join:joinOnline,local:startLocal,start:startOnline,skip,rematch,leave,ready:toggleReady,
    fast:()=>{revealN=9;clearInterval(revealTimer);render()},
    copy:()=>{navigator.clipboard?.writeText(me.code).then(()=>{b.textContent="Copié"},()=>{b.textContent=me.code})}}[b.id];
  if(a)a();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="joincode")joinOnline()});
render();connect();connectArt();
</script>
